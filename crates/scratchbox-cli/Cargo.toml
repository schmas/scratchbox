[package]
name = "scratchbox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Append stdin to the active scratchbox note without opening the TUI."

[[bin]]
name = "scratchbox"
path = "src/main.rs"
# See the note in `crates/scratchbox-core/Cargo.toml`.
bench = false

[dependencies]
scratchbox-core.workspace = true
# The subscriber, and deliberately not `tracing-appender`: this binary is fired from a global
# hotkey, and the appender would drag `time` — rejected by name in `docs/dependencies.md` —
# and `symlink` into its graph. It writes through a plain 0600 file that truncates past a cap.
scratchbox-log.workspace = true

anyhow.workspace = true

[dev-dependencies]
scratchbox-tui = { path = "../scratchbox-tui" }

crossbeam-channel.workspace = true
crossterm.workspace = true
tempfile.workspace = true
