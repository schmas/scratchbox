[package]
name = "scratchbox-log"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "File-only diagnostics for scratchbox: the activation gate, the writer, and the subscriber."

# `bench = false` so `cargo bench` selects the criterion target and not this crate's unit tests.
# `--benches` alone is not enough: cargo builds the library and binaries *as benchmarks* too, and
# those use the libtest harness, whose `getopts` exits non-zero on any criterion flag passed
# after `--` before a single bench runs.
[lib]
bench = false

# tracing-subscriber and nothing else. This crate must not grow a dependency on
# `scratchbox-core` (the core takes the `tracing` facade, not a subscriber) nor on
# `tracing-appender` (see D7: it drags `time` and `symlink` into whatever links it, and
# `scratchbox` is fired from a global hotkey).
[dependencies]
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
