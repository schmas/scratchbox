[package]
name = "scratchbox-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless core for scratchbox: config, notes, storage, watcher."

# `bench = false` so `cargo bench` selects the criterion target and not this crate's unit tests.
# `--benches` alone is not enough: cargo builds the library and binaries *as benchmarks* too, and
# those use the libtest harness, whose `getopts` exits non-zero on any criterion flag passed
# after `--` before a single bench runs.
[lib]
bench = false

[dependencies]
crossbeam-channel.workspace = true
directories.workspace = true
jiff.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
serde.workspace = true
slug.workspace = true
thiserror.workspace = true
toml.workspace = true
# The facade only. No subscriber and no appender here: this crate stays headless, and a
# library that installed a subscriber would decide for both binaries where diagnostics go.
tracing.workspace = true

[dev-dependencies]
# Turns the startup numbers asserted in source comments into measurements.
criterion.workspace = true
# Properties for `naming` and `order::reconcile`, which are pure and parse untrusted input.
proptest.workspace = true
# Labelled cases for the input/expected tables, and a fixture for the tempdir setup that was
# repeated seven times in each of two files.
rstest.workspace = true
# Test binaries install no subscriber of their own, so the watcher suite would otherwise
# record nothing on the CI runner where its race actually shows up.
scratchbox-log.workspace = true
tempfile.workspace = true

# `harness = false` is what keeps this out of the `cargo test` path: verified that
# `cargo test --workspace` neither compiles nor runs it. `cargo clippy --all-targets` does lint
# it, which is deliberate — bench code is held to the same `-D warnings` bar as everything else.
[[bench]]
name = "core"
harness = false
