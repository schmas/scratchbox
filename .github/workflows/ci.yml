name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # No Windows runner: D4 defers Windows support this cycle, and a job that reports
  # green for an untested platform is worse than no job at all.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version and components.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Phase 1 risk gate: edtui must stay compatible with ratatui, modeless, and
      # undoable. It exits non-zero if any of that regresses.
      - name: edtui spike
        run: cargo run -p scratchbox-tui --example spike_editor

  # Filesystem watching is the part of this design most likely to be subtly wrong, and
  # wrong here means lost keystrokes. inotify and FSEvents report the same change
  # differently, so both runners repeat the suite: an intermittent pass is a race, not a
  # flake, and a single green run would hide it.
  watcher-stability:
    name: watcher x20 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Build test binaries once
        run: cargo build --tests -p scratchbox-core -p scratchbox-tui

      # `scratchbox=debug`, not `trace`. Synchronous log writes on the watcher's translator
      # thread advance the clock while a suppression entry's deadline does not, and slack
      # between the TTL and the debounce window is only 1.5s. At `trace` — a line per raw
      # event, contended by sibling tests on a loaded runner — the instrumentation could evict
      # an entry early and forward an event the app made itself, reding `expect_silence` with a
      # message identical to the genuine race this job exists to catch. `Suppressor::sweep`
      # logs every eviction at `warn` so a reader can tell the two apart.
      #
      # A distinct directory per repetition: one accumulating file is twenty runs concatenated
      # with no run boundary, which is unreadable exactly when it is needed.
      - name: Run the watcher suite 20 times
        id: watcher-loop
        run: |
          for run in $(seq 1 19); do
            echo "::group::run $run"
            RUST_LOG=scratchbox=debug \
            SCRATCHBOX_LOG_DIR="${RUNNER_TEMP}/scratchbox-log/watcher/run-${run}" \
              cargo test -p scratchbox-core --test watcher || exit 1
            echo "::endgroup::"
          done
          # One repetition with diagnostics off. If a red only ever appears with logging on,
          # the instrumentation is perturbing the timing it exists to record rather than
          # recording a race, and this run is what tells those apart.
          echo "::group::run 20 (diagnostics off)"
          cargo test -p scratchbox-core --test watcher || exit 1
          echo "::endgroup::"

      # Gated on this loop's own outcome, not a bare `if: failure()`. Once any step fails
      # `failure()` is true for every later step, so a bare condition would fire this upload
      # after the *save-flow* loop failed — finding no watcher logs and, with
      # `if-no-files-found: error`, reding the job a second time over a failure that was never
      # its own.
      - name: Upload watcher logs
        if: failure() && steps.watcher-loop.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: watcher-log-${{ matrix.os }}
          path: ${{ runner.temp }}/scratchbox-log/watcher
          # `warn` is the default, which would report a green upload with no artifact — a
          # loop that died before writing anything must be visible, not quietly successful.
          if-no-files-found: error

      # The one Phase 7 test that drives a real watcher rather than synthetic events. It is
      # where suppression and autosave meet, so it belongs under the same repetition: a
      # single green run would hide a window that is one event too short.
      - name: Run the live-watcher save test 20 times
        id: save-flow-loop
        run: |
          for run in $(seq 1 19); do
            echo "::group::run $run"
            RUST_LOG=scratchbox=debug \
            SCRATCHBOX_LOG_DIR="${RUNNER_TEMP}/scratchbox-log/save-flow/run-${run}" \
              cargo test -p scratchbox-tui --test save_flow \
                repeated_saves_under_a_live_watcher || exit 1
            echo "::endgroup::"
          done
          echo "::group::run 20 (diagnostics off)"
          cargo test -p scratchbox-tui --test save_flow \
            repeated_saves_under_a_live_watcher || exit 1
          echo "::endgroup::"

      # A distinct artifact name from the watcher upload. Sharing one would 409 on the second
      # call and red the job over an upload collision rather than the test that failed.
      - name: Upload live-watcher save logs
        if: failure() && steps.save-flow-loop.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: save-flow-log-${{ matrix.os }}
          path: ${{ runner.temp }}/scratchbox-log/save-flow
          if-no-files-found: error
